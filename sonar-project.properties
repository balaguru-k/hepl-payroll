sonar.projectKey=hepl-payroll
sonar.projectName=HEPL Payroll Application
sonar.projectVersion=1.0.0
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,application/logs/**,application/cache/**,.git/**,assets/**

# PHP specific
sonar.php.coverage.reportPaths=coverage/coverage.xml
sonar.php.tests.reportPath=coverage/phpunit.xml

# Code Coverage
sonar.coverage.exclusions=tests/**,vendor/**,node_modules/**

# Duplication
sonar.cpd.exclusions=vendor/**,node_modules/**

# Import unprocessed file types
sonar.import_unknown_files=true

# Analysis properties
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
