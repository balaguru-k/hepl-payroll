sonar.projectKey=hepl-payroll
sonar.projectName=HEPL Payroll Application
sonar.projectVersion=1.0.0

# SonarQube Server
# Remove this if Jenkins passes the host URL
# sonar.host.url=http://localhost:9000

# Source
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude generated and third-party files
sonar.exclusions=\
vendor/**,\
node_modules/**,\
application/logs/**,\
application/cache/**,\
uploads/**,\
assets/**,\
system/**,\
tests/**,\
.git/**

# PHP Coverage (only if PHPUnit coverage exists)
sonar.php.coverage.reportPaths=coverage/coverage.xml
sonar.php.tests.reportPath=coverage/phpunit.xml

# Coverage exclusions
sonar.coverage.exclusions=\
vendor/**,\
node_modules/**,\
tests/**,\
system/**

# Duplicate code exclusions
sonar.cpd.exclusions=\
vendor/**,\
node_modules/**,\
system/**

# Wait for Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
