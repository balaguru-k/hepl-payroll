version: '3.8'

services:
  web:
    image: hepl-payroll:latest
    container_name: hepl-payroll-dev
    ports:
      - "8081:80"
    environment:
      CI_ENVIRONMENT: development
      DATABASE_HOST: host.docker.internal
      DATABASE_NAME: hepl_payroll
      DATABASE_USER: root
      DATABASE_PASSWORD: bala@2701
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hepl-payroll-phpmyadmin
    ports:
      - "8888:80"
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: your_mysql_password
    restart: unless-stopped
