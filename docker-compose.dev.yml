version: '3.8'

services:
  # 1. Your PHP Web Application Setup
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=bala@2701
      - DB_NAME=hepl_payroll
    depends_on:
      - db

  # 2. Your MySQL/MariaDB Database Configuration
  db:
    image: mysql:8.0 # or mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: bala@2701
      MYSQL_DATABASE: hepl_payroll

  # 3. Your phpMyAdmin Dashboard UI
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8888:80"
    environment:
      # CRITICAL FIX: Tell phpMyAdmin to point to the 'db' container name, NOT localhost
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: bala@2701
    depends_on:
      - db
